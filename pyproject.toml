[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetlight-linux"
version = "0.3.0"
description = "A native GTK4 desktop dashboard for your SSH fleet"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Fleetlight contributors"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
fleetlight = "fleetlight.__main__:main"

[tool.setuptools]
packages = ["fleetlight"]

[tool.setuptools.package-data]
fleetlight = ["updaters/*.sh"]
